<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOXY ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;padding:20px}
header{max-width:850px;margin:20px auto}
h1{color:#ff8a24}
.panel{max-width:850px;margin:15px auto;background:#1b1b1b;padding:20px;border-radius:15px}
input,select,textarea{width:100%;padding:13px;margin:7px 0 14px;background:#252525;color:white;border:1px solid #444;border-radius:9px;font-size:15px}
textarea{min-height:85px}
label{color:#ffb36f}
button{border:0;border-radius:9px;padding:12px 17px;margin:4px;background:#ff8a24;color:#17100a;font-weight:bold;cursor:pointer}
button.secondary{background:#333;color:white}
button.danger{background:#a83232;color:white}
.item{background:#252525;padding:14px;border-radius:10px;margin:10px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item span{flex:1;min-width:130px}
small{color:#aaa}
</style>
</head>
<body>

<header>
<h1>🦊 FOXY ADMIN</h1>
<p>لوحة إدارة مودات FOXY MODS</p>
<small>التعديلات تُحفظ في ملف JSON وتحتاج رفعه إلى GitHub لنشرها.</small>
</header>

<section class="panel">
<h2 id="formTitle">➕ إضافة مود جديد</h2>

<label>اسم المود</label>
<input id="name" placeholder="مثلاً: Food & Stuff">

<label>النوع</label>
<select id="type">
<option value="mod">Mod</option>
<option value="map">Map</option>
<option value="resource">Resource Pack</option>
</select>

<label>المنصة</label>
<select id="platform">
<option value="bedrock">Bedrock</option>
<option value="java">Java</option>
</select>

<label>الحالة</label>
<input id="status" placeholder="متاح الآن">

<label>الصورة أو الإيموجي</label>
<input id="image" placeholder="🍔">

<label>الوصف</label>
<textarea id="description" placeholder="اكتب وصف المود"></textarea>

<label>الإصدار</label>
<input id="version" placeholder="1.0">

<label>رابط التحميل</label>
<input id="download" placeholder="https://...">

<button id="saveButton" onclick="saveMod()">إضافة المود</button>
<button class="secondary" onclick="resetForm()">إلغاء</button>
</section>

<section class="panel">
<h2>📦 المودات الحالية</h2>
<div id="list">جاري التحميل...</div>
</section>

<section class="panel">
<h2>💾 حفظ البيانات</h2>
<p>بعد التعديل، نزّل ملف mods.json ثم ارفعه إلى المستودع الرئيسي في GitHub مكان الملف القديم.</p>
<button onclick="exportJSON()">تنزيل mods.json</button>
<button class="secondary" onclick="importJSON()">استيراد ملف JSON</button>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
</section>

<script>
let mods = [];
let editingId = null;

const fields = [
'name','type','platform','status',
'image','description','version','download'
];

function safeId() {
 return 'mod-' + Date.now() + '-' + Math.floor(Math.random()*1000);
}

async function loadMods() {
 try {
  const response = await fetch('../mods.json?time=' + Date.now());
  if (!response.ok) throw new Error();
  const data = await response.json();
  if (!Array.isArray(data)) throw new Error();
  mods = data;
  render();
 } catch {
  mods = [];
  render();
  document.getElementById('list').textContent =
   'تعذر تحميل mods.json. يمكنك استيراده من جهازك.';
 }
}

function render() {
 const list = document.getElementById('list');
 list.replaceChildren();

 if (!mods.length) {
  list.textContent = 'لا توجد مودات.';
  return;
 }

 mods.forEach(mod => {
  const item = document.createElement('div');
  item.className = 'item';

  const title = document.createElement('span');
  title.textContent = (mod.image || '📦') + ' ' + (mod.name || 'بدون اسم');

  const edit = document.createElement('button');
  edit.textContent = 'تعديل';
  edit.onclick = () => editMod(mod.id);

  const del = document.createElement('button');
  del.textContent = 'حذف';
  del.className = 'danger';
  del.onclick = () => deleteMod(mod.id);

  item.append(title, edit, del);
  list.append(item);
 });
}

function saveMod() {
 const values = {};
 fields.forEach(id => {
  values[id] = document.getElementById(id).value.trim();
 });

 if (!values.name) {
  alert('اكتب اسم المود أولاً');
  return;
 }

 if (values.download) {
  try {
   const url = new URL(values.download);
   if (!['http:','https:'].includes(url.protocol)) throw new Error();
  } catch {
   alert('رابط التحميل غير صحيح');
   return;
  }
 }

 if (editingId) {
  const index = mods.findIndex(m => m.id === editingId);
  if (index !== -1) mods[index] = {...mods[index], ...values};
 } else {
  mods.push({id:safeId(), ...values});
 }

 resetForm();
 render();
}

function editMod(id) {
 const mod = mods.find(m => m.id === id);
 if (!mod) return;

 fields.forEach(field => {
  document.getElementById(field).value = mod[field] || '';
 });

 editingId = id;
 document.getElementById('formTitle').textContent = '✏️ تعديل المود';
 document.getElementById('saveButton').textContent = 'حفظ التعديل';
 window.scrollTo({top:0,behavior:'smooth'});
}

function deleteMod(id) {
 if (!confirm('هل تريد حذف هذا المود؟')) return;
 mods = mods.filter(m => m.id !== id);
 render();
 resetForm();
}

function resetForm() {
 fields.forEach(id => document.getElementById(id).value = '');
 editingId = null;
 document.getElementById('formTitle').textContent = '➕ إضافة مود جديد';
 document.getElementById('saveButton').textContent = 'إضافة المود';
}

function exportJSON() {
 const blob = new Blob(
  [JSON.stringify(mods,null,2)],
  {type:'application/json'}
 );
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = 'mods.json';
 a.click();
 URL.revokeObjectURL(url);
}

function importJSON() {
 document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', async e => {
 const file = e.target.files[0];
 if (!file) return;

 try {
  const data = JSON.parse(await file.text());
  if (!Array.isArray(data)) throw new Error();
  mods = data;
  resetForm();
  render();
  alert('تم استيراد المودات');
 } catch {
  alert('ملف JSON غير صالح');
 }
 e.target.value = '';
});

loadMods();
</script>
</body>
</html>
